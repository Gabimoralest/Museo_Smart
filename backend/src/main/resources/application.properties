# ============================================================
# Museo Smart - Configuracion base de la aplicacion (Fase 1.2)
# ============================================================
spring.application.name=museo-smart-backend

# ------------------------------------------------------------
# Servidor
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# Datasource PostgreSQL (valores via variables de entorno)
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Museo_Smart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate (el esquema lo gestiona Flyway)
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ------------------------------------------------------------
# Flyway
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ------------------------------------------------------------
# Actuator
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ------------------------------------------------------------
# Seguridad JWT (sin secretos en el codigo: se cargan del entorno)
# El secreto DEBE tener al menos 32 caracteres. Si esta vacio, se genera
# uno aleatorio en memoria solo para desarrollo (los tokens no sobreviven
# al reinicio). En produccion configure JWT_SECRET.
# ------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# ------------------------------------------------------------
# Token temporal de restablecimiento de contrasena
# ------------------------------------------------------------
app.security.reset.expiracion-minutos=${RESET_EXPIRACION_MINUTOS:15}

# ------------------------------------------------------------
# Correo (Spring Mail / SMTP)
# Deshabilitado por defecto: en desarrollo/tests se usa LoggingMailService.
# En produccion defina APP_MAIL_HABILITADO=true y las credenciales por entorno.
# Para Gmail se requiere una contrasena de aplicacion (con verificacion en 2 pasos).
# ------------------------------------------------------------
app.mail.habilitado=${APP_MAIL_HABILITADO:false}
app.mail.from=${APP_MAIL_FROM:smartmuseo@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ------------------------------------------------------------
# Inicializacion controlada del primer SuperAdmin (opcional).
# Solo se crea si estan definidas estas variables y NO existe ningun usuario.
# Sin valores por defecto para evitar credenciales conocidas.
# ------------------------------------------------------------
app.bootstrap.superadmin.email=${MUSEO_SUPERADMIN_EMAIL:}
app.bootstrap.superadmin.password=${MUSEO_SUPERADMIN_PASSWORD:}
app.bootstrap.superadmin.nombre=${MUSEO_SUPERADMIN_NOMBRE:SuperAdministrador}
