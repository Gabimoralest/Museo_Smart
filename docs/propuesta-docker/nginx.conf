# ============================================================
# Museo_Smart - Nginx del frontend
# ------------------------------------------------------------
# ARCHIVO NUEVO (propuesta). Ubicación sugerida: frontend/nginx.conf
#
# Evita CORS sirviendo frontend y API bajo el mismo origen:
#   - /                -> archivos estáticos de la SPA
#   - /api/...         -> proxy al contenedor "backend" (puerto 8080)
#   - /actuator/health -> proxy (opcional, para diagnóstico)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Modelo 3D de 11 MB: no limitar la descarga y permitir rangos.
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/octet-stream model/gltf-binary image/svg+xml;
    gzip_min_length 1024;

    # SPA con rutas hash: el fallback cubre accesos directos a /.
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 55M;

    # API real. Sin barra final en proxy_pass para conservar /api/v1/...
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos multimedia subidos por administradores (/media/** -> backend)
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Caché larga para el modelo y las imágenes (contenido versionado).
    location ~* \.(glb|gltf|jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # No cachear el index para que los despliegues se vean.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
