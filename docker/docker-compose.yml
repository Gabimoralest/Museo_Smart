# ============================================================
# Museo_Smart - Infraestructura IoT local (Docker Compose)
# ------------------------------------------------------------
# Servicios: Node-RED, Mosquitto (MQTT), InfluxDB y Redis (estado actual).
# PostgreSQL y Spring Boot NO se incluyen (se ejecutan fuera de Docker).
#
# Uso desde PowerShell (desde la carpeta docker/):
#   Copy-Item .env.example .env      # 1) crear .env y ajustar valores
#   docker compose config            # 2) validar
#   docker compose up -d             # 3) arrancar
#   docker compose ps                # 4) estado + health
#   docker compose logs -f           # 5) logs
#   docker compose down              # 6) detener (conserva volumenes)
#
# NOTA: los puertos de host son configurables en .env para evitar choques con
# servicios ya instalados en Windows (Node-RED y Mosquitto nativos).
# ============================================================
name: museosmart-iot

services:

  # ----------------------------------------------------------
  # Mosquitto - broker MQTT con autenticacion (usuario/clave)
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: museosmart-mosquitto
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["/mosquitto/entrypoint.sh"]
    ports:
      # Solo el puerto MQTT con autenticacion. Sin websockets ni admin.
      - "${MQTT_HOST_PORT:-1884}:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/mosquitto-entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - museosmart-iot
    healthcheck:
      # Falla hasta que el broker acepta una publicacion autenticada.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883",
             "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}",
             "-t", "museo/healthcheck", "-m", "ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Node-RED - simulador IoT (flujos persistentes)
  # ----------------------------------------------------------
  nodered:
    image: nodered/node-red:4.0.9
    container_name: museosmart-nodered
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "${NODERED_HOST_PORT:-1881}:1880"
    environment:
      TZ: ${TZ:-America/Bogota}
      NODE_RED_ENABLE_PROJECTS: "false"
      FLOWS: flows.json
      # Broker y credenciales que usa el nodo MQTT del flujo. Se resuelven por
      # sustitucion de entorno (${VAR}) en museo-smart-flows.json; nunca se
      # escriben secretos en el flujo versionado. Dentro de la red Docker el
      # broker es el servicio "mosquitto" en el puerto interno 1883.
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # Seeder idempotente: copia museo-smart-flows.json a /data/flows.json solo
    # si no existe o si /data/flows.json es el placeholder de la imagen; luego
    # delega en el entrypoint oficial de Node-RED. No toca credenciales.
    entrypoint: ["bash", "/usr/local/bin/museo-nodered-entrypoint.sh"]
    volumes:
      - nodered_data:/data
      - ./nodered:/data-import:ro
      - ./nodered/nodered-entrypoint.sh:/usr/local/bin/museo-nodered-entrypoint.sh:ro
    networks:
      - museosmart-iot
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:1880/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Redis - ESTADO ACTUAL de sensores y alertas (capa volatil).
  # No es fuente de verdad: PostgreSQL conserva los datos permanentes.
  # Es una cache: sin persistencia, con maxmemory y politica allkeys-lru.
  # El backend funciona igual si Redis cae (usa PostgreSQL como respaldo).
  # ----------------------------------------------------------
  redis:
    image: redis:7.4.1
    container_name: museosmart-redis
    restart: unless-stopped
    mem_limit: 64m
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - museosmart-iot
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # InfluxDB 2.x - historico de mediciones ambientales
  # Bucket con retencion de 90 dias.
  # ----------------------------------------------------------
  influxdb:
    image: influxdb:2.7.11
    container_name: museosmart-influxdb
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "${INFLUX_HOST_PORT:-8087}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      # Acota la cache en memoria de InfluxDB (por defecto puede llegar a 1 GB).
      GOMEMLIMIT: 384MiB
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: 256m
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - museosmart-iot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mosquitto_data:
    name: museosmart_mosquitto_data
  mosquitto_log:
    name: museosmart_mosquitto_log
  nodered_data:
    name: museosmart_nodered_data
  influxdb_data:
    name: museosmart_influxdb_data
  influxdb_config:
    name: museosmart_influxdb_config

networks:
  museosmart-iot:
    name: museosmart-iot
    driver: bridge
