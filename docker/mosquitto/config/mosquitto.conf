# ============================================================
# Mosquitto - configuracion Museo_Smart
# Solo listener MQTT con autenticacion. Sin websockets ni admin remoto.
# ============================================================

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

# Persistencia de mensajes retenidos/estado entre reinicios.
persistence true
persistence_location /mosquitto/data/

# Log a stdout para que `docker compose logs` lo muestre.
log_dest stdout
log_type error
log_type warning
log_type notice
